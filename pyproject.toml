[project]
name = "ordermind"
version = "0.1.0"
description = "OrderMind - AI Order Intake Platform for multi-channel B2B orders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.9.0",
    "python-multipart>=0.0.12",
    "google-genai>=2.25.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
